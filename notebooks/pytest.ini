# The notebook environment's own tests (master plan item 18).
#
#   PYTHONPATH=src:tools/winstage .venv-notebook/bin/pytest notebooks/tests
#
# Outside Bazel for the same reason as src/pmc_train/pytest.ini: the
# notebook kernel imports torch, which the Bazel closure must never hold.
[pytest]
minversion = 8.0
addopts = -ra --strict-markers --strict-config --tb=short
testpaths = tests
filterwarnings =
    error
    # See src/pmc_train/pytest.ini: third-party import-time noise only.
    ignore::SyntaxWarning
    ignore::DeprecationWarning:torch.utils._pytree
    ignore::FutureWarning:torch.utils._pytree
    ignore::pytest.PytestAssertRewriteWarning
