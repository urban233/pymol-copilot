[project]
name = "pymol-copilot"
version = "0.0.0"
requires-python = "==3.13.13"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Isolated unit tests",
    "integration: Integration tests involving external dependencies or filesystems",
    "slow: Tests that take a significant amount of time to execute",
]
filterwarnings = [
    "error",
    # Purely mechanical: pytest's assertion-rewrite import hook discovers a
    # module (anyio, langsmith -- both langgraph's own transitive imports)
    # was already imported before the hook could instrument it, so that
    # module's own internal assertions won't get pytest's enhanced
    # messages. It says nothing about this repository's own test or
    # production code, and unlike every other warning here, escalating it
    # to a hard error is platform-dependent rather than deterministic: it
    # crashes every langgraph-importing test target's own collection on
    # Windows (observed in CI) without doing so on Linux or macOS, since
    # which module ends up "already imported" first depends on each
    # platform's own plugin autoload order, not on anything this codebase
    # controls.
    "ignore::pytest.PytestAssertRewriteWarning",
]

# Ruff configuration
[tool.ruff]
# For more info, see: https://docs.astral.sh/ruff/configuration/

# Set the target Python version
target-version = "py313"

# Exclude a variety of commonly ignored directories.
exclude = ["tmp"]
extend-exclude = [".agents", ".claude"]

# Same as Black.
line-length = 80
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = [
    "D208",  # Docstring is over-indented
    "PTH110",  # os.path.exists() should be replaced by Path.exists()
    "W",  # Warning (W)
]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
select = [
    # Rule classes
    "W",  # Warning (W)
    # Flake8 rules
    "ARG",  # flake8-unused-arguments (ARG)
    "B",  # flake8-bugbear (B)
    "SIM",  # flake8-simplify (SIM)
    "FA",  # flake8-future-annotations (FA)
    "G",  # flake8-logging-format (G)
    "LOG",  # flake8-logging (LOG)
    # "S",  # flake8-bandit (S)
    # pycodestyle rules
    "E",  # pycodestyle (E)
    # "W",  # pycodestyle (W)
    # Pylint rules
    "PLE",  # Error (PLE)
    "PLW",  # Warning (PLW)
    # Others
    "DOC",  # pydoclint (DOC)
    "D",  # pydocstyle (D)
    "F",  # Pyflakes (F)
    "RUF",  # Ruff-specific rules (RUF)
    # Specific rules
    "ANN001",  # Missing type annotation for function argument
    "ANN201",  # Missing return type annotation for public function
    "ANN204",  # Missing return type annotation for special method
    "ANN205",  # Missing return type annotation for staticmethod
    "ANN206",  # Missing return type annotation for classmethod
    "D212",  # Multi-line docstring summary should start at the first line
    "A003",  # builtin-attribute-shadowing
    "PTH110",  # `os.path.exists()` should be replaced by `pathlib.Path.exists()`
    "Q000",  # Single quotes found but double quotes preferred
    "CPY001",  # Missing copyright notice at top of file
    "N801",  # Class name {name} should use CapWords convention
    "N802",  # Function name {name} should be lowercase
    "N803",  # Argument name {name} should be lowercase
    "N804",  # First argument of a class method should be named cls
    "N805",  # First argument of a method should be named self
    "N806",  # Variable {name} in function should be lowercase
    "N807",  # Function name should not start and end with __
]
ignore = [
    "D301",  # Use r""" if any backslashes in a docstring
    "D401",  # First line of docstring should be in imperative mood: "{first_line}"
    "D413",  # Missing blank line after last section ("{name}")
    "S101",  # Use of assert detected. This clashes with the usage in tests
    "E501",  # Line too long ({width} > {limit})
    "B904",  # Ignore exception chaining
    "D104",  # Ignore missing docstring in public package
]

# Full list of rules: https://docs.astral.sh/ruff/rules/

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.pyrefly]
project-includes = ["src/pmc_client", "src/pmc_core", "src/pmc_agent", "src/pmc_data", "src/pmc_sidecar", "src/pmc_server", "tests", "tools/winstage"]
python-version = "3.13"
preset = "strict"
check-unannotated-defs = true
# tools/winstage/winstage.py is a bare top-level module reached via
# Bazel's py_library `imports = ["."]` -- resolved at runtime by
# pytest/Bazel via sys.path, but not otherwise visible to pyrefly without
# this search path. Every process that imports real PyMOL on Windows
# imports it that way (W2-01, issue #12).
# tests/integration/snapshot_support.py is the same situation for
# pmc_core.snapshot's real-PyMOL round-trip evidence: a bare sibling
# module (`from snapshot_support import ...`) imported by that package's
# own conftest.py. tests/discovery/h02 and tests/discovery/m02 each used
# to re-export its fixtures for their own prototype; both are now
# promoted (docs/master_plan.md items 4 and 5) and neither directory
# exists, so tests/integration is the only package that reaches it.
# tests/integration/pymol_error_cases.py is the same situation again for
# pmc_core.errors: one bare sibling module (`from pymol_error_cases
# import ...`) holding the broken-command table that both
# capture_pymol_errors.py and test_errors_real_pymol.py import, so the
# corpus writer and the conformance test cannot drift apart.
# tests/adversarial/denied_forms.py is the same situation again for
# src/pmc_core/screen.py (docs/master_plan.md item 8): one bare sibling
# module holding the denied-form corpus that both test_denied_forms.py and
# test_hostile_screen.py import, so the parser/policy denial suite and the
# repair-eligibility screen's own suite cannot drift apart.
# tests/contract/consumer_scan.py is the same situation once more, this
# time within tests/contract: one bare sibling module holding the import
# resolving scan that both test_errors.py and test_prompt.py use, so
# master plan items 6 and 13 cannot drift into two different notions of
# what reaching the shared core means.
search-path = [
    "tests/adversarial",
    "tests/contract",
    "tests/integration",
    "tests/recovery",
    "tools/winstage",
]

[tool.pyrefly.errors]
# --- Target PyQt6 Framework Gaps ---
# Softens warnings for packages lacking a 'py.typed' file marker
untyped-import = "warn"
# Stops errors when replacing placeholder parameters (e.g., using 'event' instead of 'a0')
bad-override = "ignore"
# Permits working with custom internal hooks across adjacent GUI layout modules
no-access = "ignore"
# Silences errors on dynamic boundaries like Qt Signals (.connect())
implicit-any = "ignore"
# Keeps missing architectural imports guarded as hard failures
missing-import = "error"
# Disable the requirement to add @override to every single Qt event/method lifecycle hook
missing-override-decorator = "ignore"
