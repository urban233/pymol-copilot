# The training package's own test configuration (master plan item 17).
#
# Run from the repository root, in the training environment:
#
#   PYTHONPATH=src .venv-train/bin/pytest src/pmc_train/tests
#
# These tests live outside Bazel and outside the root pyproject.toml's
# `testpaths` because they import torch, which the Bazel closure must
# never contain (docs/development_setup.md, "Training dependencies").
[pytest]
minversion = 8.0
addopts = -ra --strict-markers --strict-config --tb=short
testpaths = tests
markers =
    slow: builds a real llama.cpp export or reads every training sample
    gpu: needs a CUDA device
filterwarnings =
    error
    # The training stack's own import-time noise, not this package's.
    # A compile-time warning names no importing module to filter on, and
    # fires only the first time a dependency is byte-compiled (a fresh
    # venv): torchao's docstrings hold invalid escapes. Ruff keeps this
    # package's own code free of them.
    ignore::SyntaxWarning
    ignore::DeprecationWarning:torch.utils._pytree
    ignore::FutureWarning:torch.utils._pytree
    ignore::pytest.PytestAssertRewriteWarning
