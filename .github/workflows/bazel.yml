name: Bazel smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          cache-version: ${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'requirements_lock.txt') }}
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}
      - run: bazel version
      - run: bazel mod graph --lockfile_mode=error
      - run: bazel build //... --lockfile_mode=error
      - run: bazel test //... --lockfile_mode=error
      - run: bazel run //tools/bazel:check_dependency_boundaries --lockfile_mode=error
      - run: bazel run //tools/quality:ruff --lockfile_mode=error -- check .
      - run: bazel run //tools/quality:ruff --lockfile_mode=error -- format --check .
      - run: bazel run //tools/quality:pyrefly --lockfile_mode=error -- check
